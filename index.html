<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="KernsDev — custom software, automation, and AI integrations built by Grant Kerns. Fast, honest, detail-oriented." />

    <!-- Canonical -->
    <link rel="canonical" href="https://kernsdev.com/" />

    <!-- Open Graph + Twitter Card -->
    <meta property="og:title" content="KernsDev — I build software." />
    <meta property="og:description" content="Custom apps, automations, and AI integrations for businesses and individuals." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kernsdev.com/" />
    <meta property="og:image" content="https://kernsdev.com/og-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KernsDev — I build software." />
    <meta name="twitter:description" content="Custom apps, automations, and AI integrations for businesses and individuals." />
    <meta name="twitter:image" content="https://kernsdev.com/og-preview.png" />

    <!-- Connection warmup for third-party origins so DNS+TLS happens during HTML parse -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://dl.polyhaven.org" crossorigin />
    <link rel="dns-prefetch" href="https://dl.polyhaven.org" />

    <!-- Preload the 3D scene's heaviest assets so they parallelize with JS download.
         These are the same URLs used in Scene.tsx (HDR) and PBRMaterials.tsx (textures).
         CRITICAL: keep these in sync with the URLs in the components — or browsers refetch. -->
    <link rel="preload" as="fetch" type="image/vnd.radiance" crossorigin
          href="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloofendal_43d_clear_puresky_1k.hdr" />
    <link rel="preload" as="image" crossorigin
          href="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/castle_brick_07/castle_brick_07_diff_2k.jpg" />
    <link rel="preload" as="image" crossorigin
          href="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/forrest_ground_01/forrest_ground_01_diff_2k.jpg" />
    <link rel="preload" as="image" crossorigin
          href="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/asphalt_02/asphalt_02_diff_2k.jpg" />
    <link rel="preload" as="image" crossorigin
          href="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/roof_09/roof_09_diff_2k.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <title>KernsDev — I build software.</title>

    <!-- JSON-LD: Person + ProfilePage schema for richer Google snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "mainEntity": {
        "@type": "Person",
        "name": "Grant Kerns",
        "alternateName": "KernsDev",
        "jobTitle": "Software Engineer & Automation Builder",
        "description": "I build the custom software, automation, and AI integrations that don't exist off the shelf. Fast, honest, detail-oriented.",
        "url": "https://kernsdev.com/",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Somerset",
          "addressRegion": "KY",
          "addressCountry": "US"
        },
        "knowsAbout": [
          "Web Applications",
          "React",
          "TypeScript",
          "Python",
          "FastAPI",
          "Automation",
          "AI Integration",
          "Telegram Bots",
          "Cloudflare Pages"
        ],
        "worksFor": {
          "@type": "Organization",
          "name": "KernsDev",
          "url": "https://kernsdev.com/"
        }
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
